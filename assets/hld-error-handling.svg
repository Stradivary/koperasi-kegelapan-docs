<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="nfcErrG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FCE8E6"/><stop offset="100%" stop-color="#F8CFCB"/></linearGradient>
    <linearGradient id="payErrG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FEF7E0"/><stop offset="100%" stop-color="#FDE293"/></linearGradient>
    <linearGradient id="syncErrG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E8F0FE"/><stop offset="100%" stop-color="#D2E3FC"/></linearGradient>
    <linearGradient id="blockErrG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F3E8FD"/><stop offset="100%" stop-color="#E8D5F5"/></linearGradient>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#E6F4EA"/><stop offset="100%" stop-color="#CEEAD6"/></linearGradient>
    <marker id="errA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#5F6368"/></marker>
    <marker id="errR" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#CC001E"/></marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#FFFFFF" rx="4"/>

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#CC001E">Koperasi Kegelapan — Error Handling Architecture</text>
  <text x="480" y="44" text-anchor="middle" font-size="9" fill="#5F6368">Typed Error Hierarchy · NFC Corrupted Card Detection · State Machine Error Flow · Fire-and-Forget Tracking</text>

  <!-- ===== ERROR TYPE HIERARCHY (Left) ===== -->
  <text x="30" y="64" font-size="9" font-weight="700" fill="#202124">Error Types by Layer</text>

  <!-- NFC Errors -->
  <rect x="20" y="72" width="225" height="135" rx="6" fill="url(#nfcErrG)" stroke="#EA4335" stroke-width="1"/>
  <text x="30" y="88" font-size="8" font-weight="700" fill="#C5221F">🔴 NFC Errors (Core Layer)</text>
  <text x="30" y="100" font-size="6.5" fill="#5F6368">src/core/nfc/adapters/types.ts</text>

  <text x="30" y="114" font-size="6.5" font-weight="600" fill="#C5221F">NfcErrorCode:</text>
  <rect x="30" y="118" width="96" height="13" rx="2" fill="#FFF" stroke="#EA4335" stroke-width="0.4"/>
  <text x="35" y="128" font-size="6" font-family="monospace" fill="#C5221F">NOT_SUPPORTED</text>
  <rect x="130" y="118" width="100" height="13" rx="2" fill="#FFF" stroke="#EA4335" stroke-width="0.4"/>
  <text x="135" y="128" font-size="6" font-family="monospace" fill="#C5221F">PERMISSION_DENIED</text>

  <rect x="30" y="134" width="96" height="13" rx="2" fill="#FFF" stroke="#EA4335" stroke-width="0.4"/>
  <text x="35" y="144" font-size="6" font-family="monospace" fill="#C5221F">SCAN_FAILED</text>
  <rect x="130" y="134" width="100" height="13" rx="2" fill="#FFF" stroke="#EA4335" stroke-width="0.4"/>
  <text x="135" y="144" font-size="6" font-family="monospace" fill="#C5221F">WRITE_FAILED</text>

  <rect x="30" y="150" width="96" height="13" rx="2" fill="#FFF" stroke="#EA4335" stroke-width="0.4"/>
  <text x="35" y="160" font-size="6" font-family="monospace" fill="#C5221F">ABORTED</text>
  <rect x="130" y="150" width="100" height="13" rx="2" fill="#FFF" stroke="#EA4335" stroke-width="0.4"/>
  <text x="135" y="160" font-size="6" font-family="monospace" fill="#C5221F">TIMEOUT</text>

  <text x="30" y="177" font-size="6.5" fill="#5F6368">NfcError: { code, message, recoverable }</text>
  <text x="30" y="189" font-size="6" fill="#80868B" font-style="italic">Non-recoverable: NOT_SUPPORTED (hardware)</text>
  <text x="30" y="199" font-size="6" fill="#80868B" font-style="italic">Recoverable: SCAN_FAILED, TIMEOUT (retry tap)</text>

  <!-- Payload Errors -->
  <rect x="20" y="212" width="225" height="148" rx="6" fill="url(#payErrG)" stroke="#F9AB00" stroke-width="1"/>
  <text x="30" y="228" font-size="8" font-weight="700" fill="#E37400">🟡 Payload Errors (Core Layer)</text>
  <text x="30" y="240" font-size="6.5" fill="#5F6368">src/core/nfc/payloadTypes.ts</text>

  <text x="30" y="254" font-size="6.5" font-weight="600" fill="#E37400">PayloadErrorCode:</text>
  <rect x="30" y="258" width="100" height="13" rx="2" fill="#FFF" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="35" y="268" font-size="6" font-family="monospace" fill="#E37400">NO_SESSION</text>
  <rect x="134" y="258" width="100" height="13" rx="2" fill="#FFF" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="139" y="268" font-size="6" font-family="monospace" fill="#E37400">SESSION_EXPIRED</text>

  <rect x="30" y="274" width="100" height="13" rx="2" fill="#FFF" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="35" y="284" font-size="6" font-family="monospace" fill="#E37400">TENANT_MISMATCH</text>
  <rect x="134" y="274" width="100" height="13" rx="2" fill="#FFF" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="139" y="284" font-size="6" font-family="monospace" fill="#E37400">PERMISSION_DENIED</text>

  <rect x="30" y="290" width="100" height="13" rx="2" fill="#FFF" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="35" y="300" font-size="6" font-family="monospace" fill="#E37400">DECRYPTION_FAILED</text>
  <rect x="134" y="290" width="100" height="13" rx="2" fill="#FFF" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="139" y="300" font-size="6" font-family="monospace" fill="#E37400">VALIDATION_FAILED</text>

  <rect x="30" y="306" width="100" height="13" rx="2" fill="#FFF" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="35" y="316" font-size="6" font-family="monospace" fill="#E37400">WRITE_FAILED</text>

  <text x="30" y="334" font-size="6.5" fill="#5F6368">PayloadError: { code, message, tamperDetected, recoverable }</text>
  <text x="30" y="346" font-size="6" fill="#CC001E" font-weight="600">tamperDetected: true → Card is corrupted/tampered</text>
  <text x="30" y="356" font-size="6" fill="#80868B" font-style="italic">DECRYPTION_FAILED = corrupted data or wrong key</text>

  <!-- Sync/Infra Errors -->
  <rect x="20" y="365" width="225" height="102" rx="6" fill="url(#syncErrG)" stroke="#4285F4" stroke-width="1"/>
  <text x="30" y="381" font-size="8" font-weight="700" fill="#1A73E8">🔵 Sync/Infra Errors</text>
  <text x="30" y="393" font-size="6.5" fill="#5F6368">application/ + infrastructure/</text>

  <text x="30" y="408" font-size="6.5" font-family="monospace" fill="#1A73E8">SyncPullError</text>
  <text x="120" y="408" font-size="6" fill="#5F6368">— retries exhausted</text>
  <text x="30" y="420" font-size="6.5" font-family="monospace" fill="#1A73E8">SyncPullAuthError</text>
  <text x="130" y="420" font-size="6" fill="#5F6368">— 401, need re-auth</text>
  <text x="30" y="432" font-size="6.5" font-family="monospace" fill="#1A73E8">SyncPushError</text>
  <text x="120" y="432" font-size="6" fill="#5F6368">— push retries exhausted</text>
  <text x="30" y="444" font-size="6.5" font-family="monospace" fill="#1A73E8">NonRetryableServerError</text>
  <text x="155" y="444" font-size="6" fill="#5F6368">— 4xx (not 429)</text>
  <text x="30" y="456" font-size="6.5" font-family="monospace" fill="#1A73E8">DeviceBlockedError</text>
  <text x="135" y="456" font-size="6" fill="#5F6368">— device in block-list</text>

  <!-- ===== NFC CORRUPTED CARD FLOW (Right) ===== -->
  <rect x="260" y="64" width="680" height="305" rx="8" fill="url(#flowBg)" stroke="#34A853" stroke-width="1.2"/>
  <text x="600" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#137333">NFC Error Flow — Corrupted Card Detection</text>
  <text x="600" y="94" text-anchor="middle" font-size="7" fill="#5F6368">From physical NFC tap → classification → validation → state machine → UI response → tracking</text>

  <!-- Step 1: Scan -->
  <rect x="275" y="104" width="145" height="50" rx="5" fill="#FFF" stroke="#34A853" stroke-width="0.8"/>
  <circle cx="289" cy="117" r="8" fill="#34A853"/><text x="289" y="120" text-anchor="middle" font-size="7" font-weight="700" fill="#FFF">1</text>
  <text x="303" y="117" font-size="7" font-weight="600" fill="#202124">NFC Scan</text>
  <text x="303" y="130" font-size="6" fill="#5F6368">GenericNfcLayer reads raw</text>
  <text x="303" y="140" font-size="6" fill="#5F6368">bytes from NTAG215</text>
  <text x="303" y="150" font-size="5.5" fill="#80868B" font-style="italic">Error? → toNfcError()</text>

  <path d="M 420 129 L 440 129" stroke="#5F6368" stroke-width="1" marker-end="url(#errA)"/>

  <!-- Step 2: Classify -->
  <rect x="445" y="104" width="145" height="50" rx="5" fill="#FFF" stroke="#34A853" stroke-width="0.8"/>
  <circle cx="459" cy="117" r="8" fill="#34A853"/><text x="459" y="120" text-anchor="middle" font-size="7" font-weight="700" fill="#FFF">2</text>
  <text x="473" y="117" font-size="7" font-weight="600" fill="#202124">Classify Card</text>
  <text x="473" y="130" font-size="6" fill="#5F6368">cardClassifier.classify()</text>
  <text x="473" y="140" font-size="6" fill="#5F6368">Check magic: 0x4B4F5057</text>
  <text x="473" y="150" font-size="5.5" fill="#CC001E" font-weight="600">→ "invalid_format" = corrupted</text>

  <path d="M 590 129 L 610 129" stroke="#5F6368" stroke-width="1" marker-end="url(#errA)"/>

  <!-- Step 3: Validate -->
  <rect x="615" y="104" width="155" height="50" rx="5" fill="#FFF" stroke="#34A853" stroke-width="0.8"/>
  <circle cx="629" cy="117" r="8" fill="#34A853"/><text x="629" y="120" text-anchor="middle" font-size="7" font-weight="700" fill="#FFF">3</text>
  <text x="643" y="117" font-size="7" font-weight="600" fill="#202124">Validate + Decrypt</text>
  <text x="643" y="130" font-size="6" fill="#5F6368">HMAC verify, hash chain check</text>
  <text x="643" y="140" font-size="6" fill="#5F6368">Counter monotonicity</text>
  <text x="643" y="150" font-size="5.5" fill="#CC001E" font-weight="600">Fail → tamperDetected: true</text>

  <path d="M 770 129 L 790 129" stroke="#5F6368" stroke-width="1" marker-end="url(#errA)"/>

  <!-- Step 4: Block Check -->
  <rect x="795" y="104" width="130" height="50" rx="5" fill="#FFF" stroke="#EA4335" stroke-width="0.8"/>
  <circle cx="809" cy="117" r="8" fill="#EA4335"/><text x="809" y="120" text-anchor="middle" font-size="7" font-weight="700" fill="#FFF">4</text>
  <text x="823" y="117" font-size="7" font-weight="600" fill="#202124">Block Check</text>
  <text x="823" y="130" font-size="6" fill="#5F6368">blockEnforcer.check()</text>
  <text x="823" y="140" font-size="6" fill="#5F6368">On-card + IndexedDB</text>
  <text x="823" y="150" font-size="5.5" fill="#CC001E" font-weight="600">→ BLOCKED_TAMPER</text>

  <!-- Step 5: State Machine (second row) -->
  <rect x="275" y="168" width="200" height="50" rx="5" fill="#FFF" stroke="#F9AB00" stroke-width="0.8"/>
  <circle cx="289" cy="181" r="8" fill="#E37400"/><text x="289" y="184" text-anchor="middle" font-size="7" font-weight="700" fill="#FFF">5</text>
  <text x="303" y="181" font-size="7" font-weight="600" fill="#202124">State Machine Reducer</text>
  <text x="303" y="194" font-size="6" fill="#5F6368">dispatch({ type: "ERROR", error })</text>
  <text x="303" y="204" font-size="6" fill="#5F6368">→ phase: "error", tamperDetected: true</text>
  <text x="303" y="214" font-size="5.5" fill="#80868B" font-style="italic">Disables auto-scan until manual reset</text>

  <path d="M 475 193 L 495 193" stroke="#5F6368" stroke-width="1" marker-end="url(#errA)"/>

  <!-- Step 6: UI Response -->
  <rect x="500" y="168" width="200" height="50" rx="5" fill="#FFF" stroke="#9C27B0" stroke-width="0.8"/>
  <circle cx="514" cy="181" r="8" fill="#9C27B0"/><text x="514" y="184" text-anchor="middle" font-size="7" font-weight="700" fill="#FFF">6</text>
  <text x="528" y="181" font-size="7" font-weight="600" fill="#202124">UI Response</text>
  <text x="528" y="194" font-size="6" fill="#5F6368">Component checks state.tamperDetected</text>
  <text x="528" y="204" font-size="6" fill="#CC001E" font-weight="600">"Kartu Terdeteksi Rusak"</text>
  <text x="528" y="214" font-size="5.5" fill="#5F6368">Red alert · haptic buzz · manual retry only</text>

  <path d="M 700 193 L 720 193" stroke="#5F6368" stroke-width="1" marker-end="url(#errA)"/>

  <!-- Step 7: Track -->
  <rect x="725" y="168" width="200" height="50" rx="5" fill="#FFF" stroke="#4285F4" stroke-width="0.8"/>
  <circle cx="739" cy="181" r="8" fill="#1A73E8"/><text x="739" y="184" text-anchor="middle" font-size="7" font-weight="700" fill="#FFF">7</text>
  <text x="753" y="181" font-size="7" font-weight="600" fill="#202124">Error Tracking</text>
  <text x="753" y="194" font-size="6" fill="#5F6368">trackError({ category, message })</text>
  <text x="753" y="204" font-size="6" fill="#5F6368">POST /api/client-errors</text>
  <text x="753" y="214" font-size="5.5" fill="#80868B" font-style="italic">Fire-and-forget · never blocks UI</text>

  <!-- Classification Results Table -->
  <rect x="275" y="230" width="650" height="128" rx="5" fill="#FFF" stroke="#DADCE0" stroke-width="0.8"/>
  <text x="285" y="246" font-size="8" font-weight="700" fill="#202124">Card Classification Results (cardClassifier)</text>
  <rect x="285" y="252" width="630" height="0.4" fill="#DADCE0"/>

  <text x="290" y="266" font-size="6.5" font-weight="600" fill="#5F6368">Classification</text>
  <text x="400" y="266" font-size="6.5" font-weight="600" fill="#5F6368">Condition</text>
  <text x="600" y="266" font-size="6.5" font-weight="600" fill="#5F6368">Action</text>
  <text x="790" y="266" font-size="6.5" font-weight="600" fill="#5F6368">Recoverable?</text>
  <rect x="285" y="270" width="630" height="0.3" fill="#DADCE0"/>

  <rect x="290" y="275" width="80" height="13" rx="2" fill="#E6F4EA" stroke="#34A853" stroke-width="0.4"/>
  <text x="295" y="285" font-size="6" font-family="monospace" fill="#137333">valid_payload</text>
  <text x="400" y="285" font-size="6.5" fill="#202124">Magic OK + structure valid + version ≤ 4</text>
  <text x="600" y="285" font-size="6.5" fill="#5F6368">Proceed to decrypt → validate → process</text>
  <text x="790" y="285" font-size="6.5" fill="#137333" font-weight="600">✅ Normal</text>

  <rect x="290" y="292" width="80" height="13" rx="2" fill="#FFF3E0" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="295" y="302" font-size="6" font-family="monospace" fill="#E37400">empty</text>
  <text x="400" y="302" font-size="6.5" fill="#202124">No NDEF records on card</text>
  <text x="600" y="302" font-size="6.5" fill="#5F6368">Show "Kartu Kosong" — prompt card issuance</text>
  <text x="790" y="302" font-size="6.5" fill="#E37400" font-weight="600">⚠️ Expected</text>

  <rect x="290" y="309" width="80" height="13" rx="2" fill="#FFF3E0" stroke="#F9AB00" stroke-width="0.4"/>
  <text x="295" y="319" font-size="6" font-family="monospace" fill="#E37400">foreign</text>
  <text x="400" y="319" font-size="6.5" fill="#202124">NDEF data but magic ≠ 0x4B4F5057</text>
  <text x="600" y="319" font-size="6.5" fill="#5F6368">Show "Bukan Kartu Koperasi" — reject</text>
  <text x="790" y="319" font-size="6.5" fill="#E37400" font-weight="600">⚠️ Expected</text>

  <rect x="290" y="326" width="80" height="13" rx="2" fill="#FCE8E6" stroke="#EA4335" stroke-width="0.4"/>
  <text x="295" y="336" font-size="6" font-family="monospace" fill="#C5221F">invalid_format</text>
  <text x="400" y="336" font-size="6.5" fill="#202124">Magic OK but structure validation failed</text>
  <text x="600" y="336" font-size="6.5" fill="#CC001E" font-weight="600">CORRUPTED CARD — tamper alert</text>
  <text x="790" y="336" font-size="6.5" fill="#C5221F" font-weight="600">❌ Blocked</text>

  <rect x="290" y="343" width="80" height="13" rx="2" fill="#FCE8E6" stroke="#EA4335" stroke-width="0.4"/>
  <text x="295" y="353" font-size="6" font-family="monospace" fill="#C5221F">unknown</text>
  <text x="400" y="353" font-size="6.5" fill="#202124">Unrecognized data format</text>
  <text x="600" y="353" font-size="6.5" fill="#5F6368">Show "Kartu Tidak Dikenali" — reject</text>
  <text x="790" y="353" font-size="6.5" fill="#C5221F" font-weight="600">❌ Reject</text>

  <!-- ===== BOTTOM: Error Handling Patterns ===== -->
  <rect x="20" y="380" width="920" height="145" rx="6" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <text x="30" y="397" font-size="9" font-weight="700" fill="#202124">Error Handling Patterns</text>
  <rect x="30" y="403" width="900" height="0.5" fill="#DADCE0"/>

  <!-- Pattern 1: State Machine -->
  <text x="35" y="418" font-size="7" font-weight="600" fill="#E37400">Pattern 1 — State Machine Errors (NFC):</text>
  <text x="35" y="431" font-size="6.5" fill="#5F6368">Errors flow through reducer: dispatch({ type: "ERROR", error: NfcError | PayloadError }). State holds error + tamperDetected flag.</text>
  <text x="35" y="442" font-size="6.5" fill="#5F6368">Components react to state.phase === "error" and render appropriate UI. No throw/catch — deterministic state transitions.</text>

  <!-- Pattern 2: Typed Errors -->
  <text x="35" y="458" font-size="7" font-weight="600" fill="#1A73E8">Pattern 2 — Typed Error Classes (Sync/API):</text>
  <text x="35" y="471" font-size="6.5" fill="#5F6368">Custom Error classes: SyncPullError, DeviceBlockedError, NonRetryableServerError. Callers can instanceof-check for specific handling.</text>
  <text x="35" y="482" font-size="6.5" fill="#5F6368">Retry logic is built into use cases (exponential backoff). Only final failures propagate to UI layer.</text>

  <!-- Pattern 3: Fire-and-Forget -->
  <text x="35" y="498" font-size="7" font-weight="600" fill="#7B1FA2">Pattern 3 — Fire-and-Forget Tracking:</text>
  <text x="35" y="511" font-size="6.5" fill="#5F6368">trackError() sends structured events (category, message, context, deviceId) to POST /api/client-errors → Analytics Engine.</text>
  <text x="35" y="522" font-size="6.5" fill="#5F6368">Never throws, never blocks, silently drops if offline or error occurs. Error tracking must never break the app.</text>

  <!-- Key principle -->
  <rect x="620" y="410" width="295" height="105" rx="5" fill="#FFF" stroke="#CC001E" stroke-width="0.8"/>
  <text x="630" y="426" font-size="7" font-weight="700" fill="#CC001E">🔑 Key Principle:</text>
  <text x="630" y="440" font-size="6.5" fill="#202124">No React Error Boundaries for NFC errors.</text>
  <text x="630" y="453" font-size="6.5" fill="#202124">All errors handled via state machine:</text>
  <text x="640" y="466" font-size="6" fill="#5F6368">1. Core detects → returns error object</text>
  <text x="640" y="478" font-size="6" fill="#5F6368">2. Reducer transitions to error phase</text>
  <text x="640" y="490" font-size="6" fill="#5F6368">3. Component renders error state</text>
  <text x="640" y="502" font-size="6" fill="#5F6368">4. Tracker reports to backend (async)</text>
  <text x="640" y="514" font-size="6" font-weight="600" fill="#CC001E">= Predictable, testable, no unmounts</text>

  <!-- Footer -->
  <line x1="20" y1="533" x2="942" y2="533" stroke="#DADCE0" stroke-width="0.5"/>
  <text x="480" y="538" text-anchor="middle" font-size="6" fill="#80868B">Koperasi Kegelapan · KK Wallet · Error Handling Architecture · By Ahmad Muzaki</text>
</svg>
